name: check
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # The PR's tree is linted, but by main's copy of the script, so a PR cannot relax its own check.
      - name: Every closed issue gets its record in this PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGBOOK_ROOT: ${{ github.workspace }}
        run: |
          git show "origin/${{ github.event.repository.default_branch }}:bin/logbook" > "$RUNNER_TEMP/logbook"
          python3 "$RUNNER_TEMP/logbook" check --pr ${{ github.event.pull_request.number }}
