name: check
on:
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every closed issue gets its documentation in this PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 bin/logbook check --pr ${{ github.event.pull_request.number }}
